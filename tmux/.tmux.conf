# reduce tmux delay for more responsiveness
set -sg escape-time 1

# window and pane index count starts in 1
set -g base-index 1
setw -g pane-base-index 1

# ウィンドウ名の自動更新を無効にする
set-option -g allow-rename off

#: 設定ファイルを再読み込みする
bind r source-file ~/.tmux.conf \; display "Reloaded."

# enable mouse mode
set -g mouse on

# フォーカスイベントを有効化（Neovim FocusLost/FocusGained連携に必要）
set -g focus-events on
set -g set-titles on

##############################
#
# key-bind
#
##############################

# prefix key (default: C-b)
set -g prefix C-b
#: prefix キー自体を送る（ネストした tmux 用）
bind C-b send-prefix
# bind split vertically from % to |
#: ペインを縦分割する（cwd を維持）
bind | split-window -h -c "#{pane_current_path}"

#: ペインを横分割する（cwd を維持）
bind - split-window -v -c "#{pane_current_path}"

# tmux 既定の確認は "kill-pane 1? (y/n)" と番号しか言わない。番号で分かるのは
# どこにあるかだけで、何が動いているかではない。jira-dash が Claude のペインを
# 隣に開いた状態で、殺すつもりのない側を殺した事故があったので中身を出す。
#: 現在のペインを閉じる（何が動いているか確認してから）
bind x confirm-before -p "kill-pane #P (#{pane_current_command}) in #{window_name}? (y/n)" kill-pane

# smart-splits.nvim: Neovim/tmux間のシームレスなペイン移動
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|n?vim?x?)(diff)?$'"
#: 左のペインへ移動（nvim をまたいでシームレス）
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
#: 下のペインへ移動（nvim をまたいでシームレス）
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
#: 上のペインへ移動（nvim をまたいでシームレス）
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
#: 右のペインへ移動（nvim をまたいでシームレス）
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# prefix付きペイン移動（従来通り）
#: 左のペインへ移動
bind h select-pane -L
#: 下のペインへ移動
bind j select-pane -D
#: 上のペインへ移動
bind k select-pane -U
#: 右のペインへ移動
bind l select-pane -R
#: 前のウィンドウへ
bind -r C-h select-window -t :-
#: 次のウィンドウへ
bind -r C-l select-window -t :+

# pane resizing
#: ペインを左に 5 広げる（連打可）
bind -r H resize-pane -L 5
#: ペインを下に 5 広げる（連打可）
bind -r J resize-pane -D 5
#: ペインを上に 5 広げる（連打可）
bind -r K resize-pane -U 5
#: ペインを右に 5 広げる（連打可）
bind -r L resize-pane -R 5

##############################
#
# set color(dracula-theme)
#
##############################
BACK_GROUND="#282a36"
SELECTION="#44475a"
FORE_GROUND="#f8f8f2"
COMMENT="#6272a4"
CYAN="#8be9fd"
GREEN="#50fa7b"
ORANGE="#ffb86c"
PINK="#ff79c6"
PURPLE="#bd93f9"
RED="#ff5555"
YELLOW="#f1fa8c"
##############################

# set the default terminal mode to 256color mode
set -g default-terminal "screen-256color"
set -g terminal-overrides 'xterm:colors=256'

# status bar - ultra minimal
set -g status-position bottom
set -g status-style "bg=$SELECTION,fg=$FORE_GROUND"
set -g status-justify centre

# left: session name
set -g status-left-length 20
set -g status-left "#[fg=$BACK_GROUND,bg=$PURPLE,bold] #S #[default]"

# right: date/time
set -g status-right-length 30
set -g status-right "#[fg=$BACK_GROUND,bg=$PURPLE] %Y-%m-%d(%a) %H:%M:%S "

# agent state emoji prefix, driven by claude/hooks/tmux-agent-state.sh which sets
# the per-window user option @agent_state (working 🤖 / blocked 🔴 / done ✅).
# Subagent runs also count as working. The window name (#W) is untouched, so
# manual `prefix ,` naming is preserved.
AGENT_STATE="#{?#{==:#{@agent_state},working},🤖 ,#{?#{==:#{@agent_state},blocked},🔴 ,#{?#{==:#{@agent_state},done},✅ ,}}}"

# window list
set -g window-status-separator "  "
set -g window-status-current-format "#[fg=$BACK_GROUND,bg=$PURPLE] $AGENT_STATE#I:#W "
set -g window-status-format "#[fg=$COMMENT] $AGENT_STATE#I:#W "

set -g status-interval 1

# pane border color
set -g pane-border-style fg=$SELECTION
set -g pane-active-border-style fg=$COMMENT

# command / message line
set -g message-style bg=$SELECTION,fg=$PINK

# enable visual notification
setw -g monitor-activity on
set -g visual-activity on

# copy mode
## enable vi keys.
set-window-option -g mode-keys vi
## set copy mode bind v
#: コピーモードに入る
bind-key v copy-mode \; display "Copy mode!"
## copy y / Enter
#: 選択範囲をクリップボードにコピーして抜ける
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
#: 選択範囲をクリップボードにコピーして抜ける
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# restore a past window from tmux-resurrect history (fzf picker in a popup).
# `twr` is symlinked into ~/.local/bin by setup.sh.
#: 過去のウィンドウを resurrect 履歴から復元する（twr, popup）
bind W display-popup -E -w 80% -h 70% "$HOME/.local/bin/twr"

# find a past Claude Code session by what you typed, and resume it in a new
# window (fzf picker in a popup). `csr` is built into ~/.local/bin by setup.sh.
# F for "find": lowercase `s` is tmux's own session picker, so `S` here would
# read as a second session list; `C` is taken by customize-mode.
#: 過去の Claude セッションを検索して再開する（csr, popup）
bind F display-popup -E -w 90% -h 80% "$HOME/.local/bin/csr"

# read the command cheatsheet (docs/cheatsheet.md, rendered by glow) in a popup.
# g for "guide": `?` would be the obvious key but tmux uses it for list-keys,
# which is worth keeping. `keys` (no args) is the searchable sibling.
#: コマンド一覧（cheatsheet）を読む（keys --doc, popup）
bind g display-popup -E -w 90% -h 85% "$HOME/.local/bin/keys --doc"

##############################
#
# plugins (TPM) — session persistence
#
##############################
# TPM manages tmux-resurrect (save/restore) + tmux-continuum (auto save/restore).
# Scope: window/pane layout + working directories, and Claude Code panes are
# relaunched as `claude --continue`. No other programs are relaunched (nvim,
# less, etc. are intentionally excluded). TPM is cloned by setup.sh.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# resurrect: manual keys are prefix + Ctrl-s (save) / prefix + Ctrl-r (restore).
# Neutralize the built-in whitelist (vi vim nvim emacs man less more tail top
# htop ...) with a non-matching sentinel so ONLY claude is relaunched. An empty
# value would fall back to that default list, so the sentinel must be non-empty.
set -g @resurrect-default-processes '__none__'
# Restore claude panes with their SAVED command verbatim (`~claude`, no `->`), so a
# pane saved as `claude --resume <id>` comes back to that exact session instead of
# collapsing onto the cwd's most-recent conversation. Panes without a session id
# come back as whatever was saved (e.g. a fresh `claude ...`). For deliberate,
# per-pane-smart restores use `twr` (prefix + W), which upgrades id-less duplicates
# in the same cwd to an interactive `claude --resume` picker.
set -g @resurrect-processes '"~claude"'

# continuum: auto-save every 15 min, but NO auto-restore on tmux server start.
# Snapshots keep accumulating (twr reads that history), while restoring stays
# manual: prefix + Ctrl-r (whole snapshot) or prefix + W / twr (one window).
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'

# initialize TPM — KEEP THIS LINE AT THE VERY BOTTOM OF THE FILE
run '~/.tmux/plugins/tpm/tpm'
