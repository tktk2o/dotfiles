# treefmt.toml — formatter registry for this repo.
#
# Deliberately narrow: only formatters for languages verified (via `find`) to
# actually exist here are registered. Do not add a formatter for a language
# with no files just because treefmt supports it.
#
# Scope decisions:
#   - shfmt targets *.sh only, not zsh/*.zsh or zsh/.zshrc. shfmt's dialects
#     are bash/posix/mksh; it does not understand zsh-only syntax (e.g.
#     `(( ))` arithmetic quirks, zsh globbing) and could silently corrupt
#     those files. Every *.sh file in this repo is `#!/bin/bash` or
#     `#!/bin/sh` (verified), so shfmt is safe there.
#   - stylua excludes nvim/. That tree is LazyVim-derived, not hand-written
#     here; running stylua over it now would produce a large one-time diff
#     unrelated to any real change and would drift it from upstream LazyVim
#     formatting conventions. nvim-peek/init.lua is our own small,
#     hand-written config (not LazyVim-derived), so it stays in scope.
#   - gofmt covers claude/csr/ and tools/cheatsheet/, the only Go in the repo.
#   - global excludes: .worktrees/ (other git worktrees, not this repo's
#     content), karabiner/automatic_backups/ (written by Karabiner itself),
#     raycast/ (exported settings blob, not source we edit by hand),
#     docs/cheatsheet.md (generated by `keys --generate`; reformatting it
#     would just be undone by the next regeneration).

[global]
excludes = [
  ".worktrees/**",
  # Agent-tool worktrees land here, not in .worktrees/ — same reason to skip.
  ".claude/worktrees/**",
  "karabiner/automatic_backups/**",
  "raycast/**",
  "docs/cheatsheet.md",
]

[formatter.shell]
command = "shfmt"
options = ["-w", "-i", "4", "-ci"]
includes = ["*.sh"]

[formatter.lua]
command = "stylua"
options = ["--"]
includes = ["*.lua"]
excludes = ["nvim/**"]

[formatter.go]
command = "gofmt"
options = ["-w"]
includes = ["*.go"]
